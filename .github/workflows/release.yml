name: Release

# Cuts the direct (Developer ID) build: archive, sign, notarize, staple, DMG,
# verify, publish to a GitHub Release with a SHA-256 beside it.
#
# Honest notes, because this file automates steps nobody has run yet:
#
#   - Notarization has never been executed against this account (BLOCKERS.md B6).
#     The credentials exist, scripts/notarize.sh knows how to use them, and this
#     workflow wires them up, but the first tag push is a debugging session.
#     Run it once with workflow_dispatch and no tag input first: that path builds,
#     notarizes and verifies without creating a Release, so a failure costs
#     nothing public.
#   - Sparkle is not wired into the build (BLOCKERS.md B3). There is no appcast
#     step here on purpose. scripts/sign-update.sh must keep running on the
#     maintainer's machine because the EdDSA private key lives in their login
#     Keychain and must never be copied into a repository secret.
#   - Nothing here builds or submits the Mac App Store target. See the comment on
#     the `mac-app-store` non-job at the bottom of this file.
#
# The whole job is driven through scripts/release.sh and scripts/notarize.sh.
# Those scripts are the source of truth for how Vigil is signed and packaged; if
# a signing detail needs to change, change it there so a local release and a CI
# release cannot diverge.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to publish, for example v1.0.0. Leave empty for a dry run
          that builds, notarizes and verifies but publishes nothing.
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pinned deliberately. macos-latest moves without warning and a release job
    # is the last place that should discover a new Xcode by surprise. Raise this
    # on purpose, after a dry run on the new image.
    runs-on: macos-15
    timeout-minutes: 90

    env:
      # Where the throwaway keychain and the two decoded credential files live.
      # RUNNER_TEMP is wiped with the runner, and the cleanup step below removes
      # them explicitly anyway.
      KEYCHAIN_PATH: ${{ runner.temp }}/vigil-release.keychain-db
      NOTARY_PROFILE: VigilReleaseCI

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen create-dmg xcbeautify

      # ------------------------------------------------------------------ facts
      # Everything downstream reads the version from here, and the version comes
      # from project.yml rather than from the tag, so a tag that disagrees with
      # the shipped CFBundleShortVersionString fails before anything is built.
      - name: Resolve version, tag and team ID
        id: facts
        run: |
          set -euo pipefail

          MARKETING="$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          BUILD="$(awk -F'"' '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ { print $2; exit }' project.yml)"
          TEAM="$(awk '/^[[:space:]]*DEVELOPMENT_TEAM:/ { print $2; exit }' project.yml)"

          [ -n "$MARKETING" ] || { echo "no MARKETING_VERSION in project.yml" >&2; exit 1; }
          [ -n "$BUILD" ]     || { echo "no CURRENT_PROJECT_VERSION in project.yml" >&2; exit 1; }
          [ -n "$TEAM" ]      || { echo "no DEVELOPMENT_TEAM in project.yml" >&2; exit 1; }

          case "${GITHUB_REF_TYPE:-}" in
            tag) TAG="$GITHUB_REF_NAME" ;;
            *)   TAG="${{ inputs.tag }}" ;;
          esac

          if [ -n "$TAG" ]; then
            PUBLISH=1
            [ "$TAG" = "v$MARKETING" ] || {
              echo "tag '$TAG' does not match MARKETING_VERSION '$MARKETING' in project.yml." >&2
              echo "Bump project.yml and retag, or tag v$MARKETING. See docs/RELEASING.md." >&2
              exit 1
            }
          else
            PUBLISH=0
            echo "No tag: dry run. Nothing will be published."
          fi

          {
            echo "version=$MARKETING"
            echo "build=$BUILD"
            echo "team=$TEAM"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "version $MARKETING ($BUILD), team $TEAM, tag '${TAG:-none}', publish $PUBLISH"

      # The release notes come out of CHANGELOG.md, not out of the commit log.
      # Extracted before the build so a missing section fails in ten seconds
      # rather than after a notarization round trip.
      - name: Extract the CHANGELOG section
        run: |
          set -euo pipefail
          V='${{ steps.facts.outputs.version }}'
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          # A whitespace-only section means the heading exists and the notes do
          # not, which would publish an empty release.
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || {
            echo "CHANGELOG.md has no content under '## [$V]'." >&2
            echo "Add the section before tagging. See docs/RELEASING.md." >&2
            exit 1
          }
          echo "notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines"

      # ------------------------------------------------------------- credentials
      # Two secrets go into a keychain that exists only for this job:
      #
      #   1. the Developer ID Application certificate and its private key, as a
      #      base64 .p12, so codesign and `security find-identity` can see it
      #   2. a notarytool credential profile built from the App Store Connect API
      #      key, so the .p8 itself only exists on disk for the few seconds
      #      store-credentials needs it
      #
      # Nothing here echoes a secret. The decoded files are written with printf
      # into RUNNER_TEMP, never cat-ed, and shredded in the cleanup step. Do not
      # add `set -x` to these steps: it would print the decoded values.
      - name: Create the temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$CERT_P12_BASE64" ] || { echo "secret DEVELOPER_ID_CERTIFICATE_P12_BASE64 is empty" >&2; exit 1; }
          [ -n "$CERT_PASSWORD" ]   || { echo "secret DEVELOPER_ID_CERTIFICATE_PASSWORD is empty" >&2; exit 1; }

          # Generated here rather than stored as a secret: it protects a keychain
          # that is deleted before the job ends, so there is nothing to rotate and
          # one fewer long-lived value in the repository settings.
          # Deliberately not exported to GITHUB_ENV: no later step needs it, and
          # the cleanup step deletes the keychain by path.
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          P12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$P12"
          [ -s "$P12" ] || { echo "the certificate secret did not base64-decode to anything" >&2; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # -lut with no -l: never auto-lock on idle. A notarization wait can run
          # past any timeout and a locked keychain fails the DMG signature at the
          # very end of the job.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild \
            -f pkcs12 -A

          rm -f "$P12"

          # scripts/release.sh calls `security find-identity`, which reads the
          # user search list. Prepending rather than replacing keeps the runner's
          # own keychains available to xcodebuild.
          EXISTING="$(security list-keychains -d user | sed -e 's/[[:space:]]*"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
          security default-keychain -s "$KEYCHAIN_PATH"

          # Without this, codesign blocks on a GUI prompt that will never be
          # answered and the job hangs until the timeout.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          echo "identities in the release keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "Developer ID Application" \
            || { echo "the imported certificate is not a Developer ID Application identity" >&2; exit 1; }

      - name: Store the notarytool credentials in the temporary keychain
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          [ -n "$ASC_KEY_P8_BASE64" ] || { echo "secret APP_STORE_CONNECT_KEY_P8_BASE64 is empty" >&2; exit 1; }
          [ -n "$ASC_KEY_ID" ]        || { echo "secret APP_STORE_CONNECT_KEY_ID is empty" >&2; exit 1; }
          [ -n "$ASC_ISSUER_ID" ]     || { echo "secret APP_STORE_CONNECT_ISSUER_ID is empty" >&2; exit 1; }

          P8="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$P8"
          grep -q 'BEGIN PRIVATE KEY' "$P8" || {
            echo "APP_STORE_CONNECT_KEY_P8_BASE64 did not decode to a PEM private key." >&2
            echo "It must be the base64 of the whole AuthKey_<KEYID>.p8 file." >&2
            exit 1
          }

          # store-credentials validates against Apple before it writes, so a bad
          # issuer id fails here instead of after a twenty minute upload.
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$P8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

          # The profile is in the keychain now. The raw key does not need to sit
          # on disk for the rest of the job.
          rm -f "$P8"

          xcrun notarytool history \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" > /dev/null

      # ------------------------------------------------------------------ build
      # scripts/release.sh does the whole thing: xcodegen, archive, export with
      # developer-id, hardened-runtime assertion, create-dmg, sign the DMG, then
      # scripts/notarize.sh to submit, wait, staple and validate.
      #
      # VIGIL_NOTARY_KEYCHAIN is the one thing CI needs that a local release does
      # not: locally the notarytool profile is in the login keychain and
      # notarytool finds it unaided. Both scripts treat it as optional.
      - name: Build, sign, notarize, staple and package
        env:
          VIGIL_TEAM_ID: ${{ steps.facts.outputs.team }}
          VIGIL_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
          VIGIL_NOTARY_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          VIGIL_SIGN_IDENTITY: Developer ID Application
        run: scripts/release.sh

      # -------------------------------------------------------------- verify
      # The gate between "a file exists" and "a stranger can double-click it".
      # Every command here is fatal: set -e plus a job that publishes nothing if
      # this step is red.
      #
      # scripts/release.sh notarizes and staples the DMG. The .app inside it is
      # signed and covered by the same notarization but carries no stapled ticket
      # of its own, so it is stapled here before spctl is asked about it.
      # Otherwise spctl would be answering from Apple's CDN over the network and
      # a network blip would read as a signing failure.
      - name: Verify the artefact
        id: verify
        run: |
          set -euo pipefail

          APP="dist/export/Vigil.app"
          DMG="dist/Vigil-${{ steps.facts.outputs.version }}.dmg"
          [ -d "$APP" ] || { echo "no app at $APP" >&2; exit 1; }
          [ -f "$DMG" ] || { echo "no dmg at $DMG" >&2; exit 1; }

          echo "==> staple the app (the ticket exists because the DMG was notarized)"
          xcrun stapler staple "$APP"

          echo "==> codesign --verify --deep --strict"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "==> spctl -a -vvv"
          spctl -a -vvv -t exec "$APP"

          echo "==> xcrun stapler validate"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

          echo "==> the DMG as Gatekeeper reads it"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"

          echo "==> signing details for the log"
          codesign -dvvv "$APP" 2>&1 | grep -E 'Identifier=|Authority=|TeamIdentifier=|flags=|Timestamp=' || true

          # Hardened runtime is not optional for a notarized build and its absence
          # is otherwise only visible in a wall of codesign output.
          codesign -d --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "the app is not hardened-runtime signed" >&2; exit 1; }

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      # Published beside the DMG so a download can be checked without trusting
      # the transport. The file is written from inside dist/ so it contains a
      # bare filename and `shasum -c` works wherever it is downloaded to.
      - name: Compute the SHA-256
        id: digest
        run: |
          set -euo pipefail
          DMG_NAME="Vigil-${{ steps.facts.outputs.version }}.dmg"
          (cd dist && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          SHA="$(awk '{ print $1 }' "dist/$DMG_NAME.sha256")"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$DMG_NAME  $SHA"

      - name: Upload the build artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vigil-${{ steps.facts.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: warn

      # ---------------------------------------------------------------- publish
      # Notes from CHANGELOG.md, not from the commit log. The digest is appended
      # so it is visible on the release page itself and not only in a sidecar
      # file that nobody opens.
      - name: Publish the GitHub Release
        if: steps.facts.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.facts.outputs.tag }}'
          VERSION='${{ steps.facts.outputs.version }}'
          DMG_NAME="Vigil-$VERSION.dmg"

          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "### Verifying this download"
            echo
            echo '```'
            echo "shasum -a 256 $DMG_NAME"
            echo "${{ steps.digest.outputs.sha256 }}  $DMG_NAME"
            echo '```'
            echo
            echo "The DMG is signed with Developer ID and carries a stapled notarization ticket."
            echo "\`spctl -a -t open --context context:primary-signature $DMG_NAME\` should accept it offline."
          } > "$RUNNER_TEMP/release-body.md"

          gh release create "$TAG" \
            --title "Vigil $VERSION" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --verify-tag \
            "dist/$DMG_NAME" \
            "dist/$DMG_NAME.sha256"

      - name: Dry run summary
        if: steps.facts.outputs.publish != '1'
        run: |
          set -euo pipefail
          {
            echo "### Dry run"
            echo
            echo "Built, notarized, stapled and verified Vigil ${{ steps.facts.outputs.version }}."
            echo "Nothing was published, because this run had no tag."
            echo
            echo "SHA-256: \`${{ steps.digest.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- cleanup
      # always(), and last. A keychain holding a Developer ID private key must not
      # survive the job even when the job failed halfway through. Especially then,
      # because a failed release is the run somebody re-triggers.
      - name: Delete the temporary keychain
        if: always()
        run: |
          set -uo pipefail
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$KEYCHAIN_PATH" \
                "$RUNNER_TEMP/developer-id.p12" \
                "$RUNNER_TEMP/AuthKey.p8"
          security list-keychains -d user
          echo "release keychain removed"

# ---------------------------------------------------------------------------
# There is deliberately no mac-app-store job here.
#
# Uploading a build to App Store Connect from CI is technically easy (the same
# API key would do it). It is not done because the submission is not the upload:
#
#   - The MAS build is blocked on B2, the StoreKit consumable product IDs, which
#     cannot be registered without the owner's App Store Connect account. The tip
#     UI is behind a flag that stays off until real products exist, so a build
#     uploaded today would be a build with a feature switched off.
#   - Every submission needs review notes written by hand: docs/06 lists the two
#     questions a reviewer will ask, about reading ~/.claude and about the
#     loopback socket, and both answers are prose, not a build setting. A demo
#     video is expected with them.
#   - An automated upload burns a build number on every tag whether or not
#     anybody intended to submit, and build numbers cannot be reused.
#
# What CI does own is the part a machine can prove: .github/workflows/ci.yml
# builds Vigil-MAS and runs scripts/verify-mas-build.sh on every push, so a
# Sparkle symbol or a stray network.client entitlement is caught long before a
# human opens Transporter. The upload stays manual until B2 is resolved.
#
# There is also no appcast step. Sparkle is not in the build (B3), and when it
# is, scripts/sign-update.sh still runs on the maintainer's machine: the EdDSA
# private key lives in their login Keychain by design and putting a copy in a
# repository secret would defeat the point of signing updates at all.
